[package]
name = "ptdf-recorder"
description = "Event Recorder (architecture §5, §8): the top-level orchestrator that ties PlatformInterceptor -> RecorderSink -> SegmentWriter -> MetadataStore -> metrics into one recording session run loop. This is the integration point for every per-syscall-category 'recorder' (System Call/Scheduler/Thread/Process/Signal/FileSystem/Network/Clock/RNG/Memory/IPC) — on every currently-implemented platform adapter those are distinguished by EventKind (see ptdf-pal-linux::syscall_table docs), not by separate interception subsystems, so this crate is where they all converge into segments."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
ptdf-types = { path = "../ptdf-types" }
ptdf-pal = { path = "../ptdf-pal" }
ptdf-recorder-core = { path = "../ptdf-recorder-core" }
ptdf-storage = { path = "../ptdf-storage" }
ptdf-metadata = { path = "../ptdf-metadata" }
ptdf-metrics = { path = "../ptdf-metrics" }
ptdf-logging = { path = "../ptdf-logging" }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3"
