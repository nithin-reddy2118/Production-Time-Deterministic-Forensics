[package]
name = "ptdf-replay-engine"
description = "Replay Engine (architecture §6): loads a session's segments via MetadataStore+ptdf-storage, linearizes events by HLC (§15), and drives any ReplayDriver (§13) through them, surfacing divergences as first-class results rather than errors."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
ptdf-types = { path = "../ptdf-types", version = "0.1.0" }
ptdf-pal = { path = "../ptdf-pal", version = "0.1.0" }
ptdf-storage = { path = "../ptdf-storage", version = "0.1.0" }
ptdf-metadata = { path = "../ptdf-metadata", version = "0.1.0" }
ptdf-logging = { path = "../ptdf-logging", version = "0.1.0" }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3"
